name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Playwright — ${{ github.event_name == 'push' && 'sanity' || github.event_name == 'pull_request' && 'smoke' || 'regression (full suite)' }}
    runs-on: ubuntu-latest
    environment: dev1
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Select test slice
        id: slice
        run: |
          case "${{ github.event_name }}" in
            push)
              echo "command=npm run test:sanity" >> "$GITHUB_OUTPUT"
              echo "artifact=sanity" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              echo "command=npm run test:smoke" >> "$GITHUB_OUTPUT"
              echo "artifact=smoke" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "command=npx playwright test" >> "$GITHUB_OUTPUT"
              echo "artifact=regression" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run Playwright tests
        run: ${{ steps.slice.outputs.command }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ steps.slice.outputs.artifact }}
          path: playwright-report/
          retention-days: 30
